<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · DB Browser</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Cellipse cx='16' cy='10' rx='8' ry='3' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M8 10v12c0 1.7 3.6 3 8 3s8-1.3 8-3V10M8 16c0 1.7 3.6 3 8 3s8-1.3 8-3' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/common.js" defer></script>
  <script src="/static/login.js" defer></script>
</head>
<body class="auth-body">
  <button class="icon-btn auth-theme" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"><svg><use href="/static/icons.svg#i-moon"/></svg></button>

  <main class="auth-wrap">
    <div class="auth-brand">
      <span class="brand-mark"><svg><use href="/static/icons.svg#i-db"/></svg></span>
      <span>DB Browser</span>
    </div>

    <div class="card auth-card">
      <div class="auth-tabs" role="tablist">
        <button role="tab" id="tabSignin" class="on" aria-selected="true" aria-controls="signinForm">Sign in</button>
        <button role="tab" id="tabSignup" aria-selected="false" aria-controls="signupForm">Request access</button>
      </div>

      <form id="signinForm" class="auth-form" novalidate>
        <div>
          <h1>Welcome back</h1>
          <p class="auth-sub">Sign in to browse the data.</p>
        </div>
        <label class="form-field"><span>E-mail</span>
          <input id="siEmail" type="email" autocomplete="username" required></label>
        <label class="form-field"><span>Password</span>
          <input id="siPassword" type="password" autocomplete="current-password" required></label>
        <div class="form-error" id="siError" role="alert"></div>
        <button class="btn btn-primary btn-block" type="submit" id="siSubmit">Sign in</button>
        <p class="auth-foot">No account yet? <button type="button" class="link-btn" id="toSignup">Request access</button></p>
      </form>

      <form id="signupForm" class="auth-form" novalidate hidden>
        <div>
          <h1>Request access</h1>
          <p class="auth-sub">An administrator reviews every request. You can sign in once it’s approved.</p>
        </div>
        <label class="form-field"><span>Full name</span>
          <input id="suName" autocomplete="name" maxlength="120" required></label>
        <label class="form-field"><span>E-mail</span>
          <input id="suEmail" type="email" autocomplete="email" maxlength="254" required></label>
        <label class="form-field"><span>Password <small>(at least 8 characters)</small></span>
          <input id="suPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <label class="form-field"><span>Confirm password</span>
          <input id="suConfirm" type="password" autocomplete="new-password" required></label>
        <div class="form-error" id="suError" role="alert"></div>
        <button class="btn btn-primary btn-block" type="submit" id="suSubmit">Send request</button>
        <p class="auth-foot">Already approved? <button type="button" class="link-btn" id="toSignin">Sign in</button></p>
      </form>

      <div id="signupDone" class="auth-form auth-done" hidden>
        <div class="done-icon"><svg><use href="/static/icons.svg#i-check"/></svg></div>
        <h1>Request sent</h1>
        <p class="auth-sub" id="doneText"></p>
        <button class="btn btn-block" type="button" id="doneBack">Back to sign in</button>
      </div>
    </div>

    <p class="auth-note" id="noAdminNote" hidden>
      No administrator exists yet. On the server, run <code>python manage.py create-admin</code>.
    </p>
  </main>
</body>
</html>
