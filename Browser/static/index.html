<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DB Browser</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Cellipse cx='16' cy='10' rx='8' ry='3' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M8 10v12c0 1.7 3.6 3 8 3s8-1.3 8-3V10M8 16c0 1.7 3.6 3 8 3s8-1.3 8-3' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></symbol>
    <symbol id="i-columns" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m7 14 5-5 5 5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
    <symbol id="i-alert"viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg><use href="#i-db"/></svg></span>
      <span class="brand-name">DB Browser</span>
    </div>
    <div class="db-pill" id="dbPill" hidden>
      <span class="db-file" id="dbFile"></span>
      <span class="badge badge-accent" id="dbEncrypted" hidden><svg><use href="#i-lock"/></svg>Encrypted</span>
      <span class="badge" id="dbReadonly" hidden><svg><use href="#i-eye"/></svg>Read-only</span>
      <span class="db-size" id="dbSize"></span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="reloadBtn" title="Reload .env and reconnect" aria-label="Reload database"><svg><use href="#i-refresh"/></svg></button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"><svg><use href="#i-moon"/></svg></button>
    </div>
  </header>

  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-title">Tables</div>
      <nav id="tableList" class="table-list"></nav>
    </aside>

    <main class="content" id="content">
      <div class="page-head">
        <div>
          <h1 id="tableTitle">&nbsp;</h1>
          <p class="subtitle" id="tableSubtitle"></p>
        </div>
        <div class="head-actions">
          <button class="btn btn-danger-soft" id="bulkDeleteBtn" hidden><svg><use href="#i-trash"/></svg>Delete <span id="selectedCount"></span></button>
          <button class="btn" id="clearFiltersBtn" hidden><svg><use href="#i-x"/></svg>Clear filters<span class="count" id="filterCount"></span></button>
          <div class="popover-wrap">
            <button class="btn" id="columnsBtn" aria-haspopup="true"><svg><use href="#i-columns"/></svg>Columns</button>
            <div class="popover popover-right" id="columnsPopover" hidden>
              <div class="popover-title">Visible columns <button class="link-btn" id="showAllCols">Show all</button></div>
              <div id="columnsList" class="columns-list"></div>
            </div>
          </div>
          <button class="btn btn-primary" id="addBtn"><svg><use href="#i-plus"/></svg>Add row</button>
        </div>
      </div>

      <div class="card table-card">
        <div class="progress" id="progress" hidden></div>
        <div class="table-scroll" id="tableScroll">
          <table class="grid" id="grid">
            <thead id="gridHead"></thead>
            <tbody id="gridBody"></tbody>
          </table>
          <div class="empty" id="emptyState" hidden>
            <svg><use href="#i-search"/></svg>
            <div class="empty-title">No matching rows</div>
            <div class="empty-text">Try different filter values.</div>
            <button class="btn btn-sm" id="clearAllEmpty">Clear filters</button>
          </div>
        </div>
        <div class="table-foot">
          <div class="range" id="rangeText"></div>
          <div class="pager">
            <label class="page-size">Rows
              <select id="pageSize"><option>25</option><option selected>50</option><option>100</option><option>250</option></select>
            </label>
            <div class="pages" id="pages"></div>
          </div>
        </div>
      </div>
    </main>

    <main class="content error-screen" id="errorScreen" hidden>
      <div class="card error-card">
        <div class="error-icon"><svg><use href="#i-alert"/></svg></div>
        <h2>Can’t open the database</h2>
        <p class="error-message" id="errorMessage"></p>
        <div class="error-help">
          <p>Configure <code>Browser/.env</code>, then retry:</p>
          <pre>DB_PATH=data/your-file.sqlite3
# Only for encrypted files; leave empty otherwise
DB_PASSWORD=your-password</pre>
        </div>
        <button class="btn btn-primary" id="retryBtn"><svg><use href="#i-refresh"/></svg>Reload .env &amp; retry</button>
      </div>
    </main>
  </div>

  <!-- Row editor drawer -->
  <div class="scrim" id="drawerScrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-labelledby="drawerTitle">
    <form id="rowForm" class="drawer-inner" novalidate>
      <header class="drawer-head">
        <div>
          <div class="drawer-kicker" id="drawerKicker"></div>
          <h2 id="drawerTitle"></h2>
        </div>
        <button type="button" class="icon-btn" id="drawerClose" aria-label="Close"><svg><use href="#i-x"/></svg></button>
      </header>
      <div class="drawer-body" id="drawerFields"></div>
      <footer class="drawer-foot">
        <button type="button" class="btn btn-danger-soft" id="drawerDelete"><svg><use href="#i-trash"/></svg>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="drawerCancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="drawerSave">Save</button>
      </footer>
    </form>
  </aside>

  <!-- Confirm dialog -->
  <div class="modal-scrim" id="confirmScrim" hidden>
    <div class="modal" role="alertdialog" aria-labelledby="confirmTitle" aria-describedby="confirmText">
      <div class="modal-icon"><svg><use href="#i-trash"/></svg></div>
      <h3 id="confirmTitle"></h3>
      <p id="confirmText"></p>
      <div class="modal-actions">
        <button class="btn" id="confirmCancel">Cancel</button>
        <button class="btn btn-danger" id="confirmOk">Delete</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
