# nginx site for DB Browser (copy to /etc/nginx/sites-available/dbbrowser and link
# into sites-enabled). Public: https://65.108.79.94:9443 -> app on 127.0.0.1:8765.
# Self-signed certificate in /etc/nginx/dbbrowser-tls/ (see README "Hosting").
limit_req_zone $binary_remote_addr zone=dbbrowser_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dbbrowser_api:10m rate=30r/s;

server {
    listen 9443 ssl http2;
    listen [::]:9443 ssl http2;
    server_name 65.108.79.94;

    ssl_certificate     /etc/nginx/dbbrowser-tls/server.crt;
    ssl_certificate_key /etc/nginx/dbbrowser-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:dbbrowser_tls:5m;

    # Someone typed http:// on the https port: send them to https.
    error_page 497 =301 https://$host:$server_port$request_uri;

    client_max_body_size 1m;
    server_tokens off;

    # Sign-in and sign-up: slow down password guessing (the app also rate limits).
    location ~ ^/api/auth/(login|signup)$ {
        limit_req zone=dbbrowser_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
        include /etc/nginx/dbbrowser-proxy.conf;
    }

    location / {
        limit_req zone=dbbrowser_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
        include /etc/nginx/dbbrowser-proxy.conf;
    }
}
